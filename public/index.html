<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Moderadores</title>
<style>
  :root { --bg:#0e0e10; --card:#18181b; --line:#2f2f35; --txt:#efeff1; --mut:#adadb8; --acc:#9147ff; --ok:#00c853; --err:#ff4d4f; --warn:#ffb300; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f6; --card:#fff; --line:#dcdce1; --txt:#18181b; --mut:#5f5f6b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; } h2 { font-size:14px; margin:0 0 10px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  main { display:grid; grid-template-columns:340px 1fr; gap:16px; padding:16px; max-width:1300px; margin:auto; }
  @media (max-width:820px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 12px; cursor:pointer; font:inherit; }
  button.sec { background:transparent; color:var(--txt); border:1px solid var(--line); }
  button.danger { background:var(--err); } button.warn { background:var(--warn); color:#000; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=text] { width:100%; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  .acc { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .acc:last-child { border:0; } .acc .name { flex:1; font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); }
  .dot.online { background:var(--ok); } .dot.connecting { background:var(--warn); } .dot.error { background:var(--err); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #chat { height:55vh; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); }
  .msg { padding:3px 4px; border-radius:4px; word-break:break-word; } .msg:hover { background:var(--card); }
  .msg .tools { display:none; float:right; gap:4px; } .msg:hover .tools { display:inline-flex; }
  .msg .tools button { padding:1px 7px; font-size:12px; }
  .u { font-weight:700; margin-right:6px; }
  .err { color:var(--err); } small, .mut { color:var(--mut); }
  select { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>Moderadores · <span id="channel" class="mut"></span></h1>
  <div class="row">
    <button id="add">+ Adicionar conta</button>
    <button class="sec" id="invite">Link para moderador</button>
    <button class="sec" id="all">Ligar todas</button>
  </div>
</header>
<main>
  <section>
    <div class="card"><h2>Contas (<span id="count">0</span>)</h2><div id="accounts"></div>
      <p class="mut" style="margin:10px 0 0;font-size:13px"><b>Adicionar conta:</b> inicia sessão na Twitch com a conta do moderador (janela anónima ou outro browser) e depois clica em adicionar. Ou envia o <b>link para moderador</b> e a pessoa autoriza do PC dela.</p>
    </div>
    <div class="card"><h2>Modo do chat</h2>
      <div class="row">
        <button class="sec" data-set='{"slow_mode":true,"slow_mode_wait_time":10}'>Slow 10s</button>
        <button class="sec" data-set='{"slow_mode":false}'>Slow off</button>
        <button class="sec" data-set='{"emote_mode":true}'>Só emotes</button>
        <button class="sec" data-set='{"emote_mode":false}'>Emotes off</button>
        <button class="sec" data-set='{"follower_mode":true,"follower_mode_duration":0}'>Só followers</button>
        <button class="sec" data-set='{"follower_mode":false}'>Followers off</button>
      </div>
      <div class="row" style="margin-top:10px"><button class="danger" id="clear">Limpar chat</button></div>
    </div>
  </section>
  <section>
    <div class="card"><h2>Chat em direto</h2>
      <div class="row" style="margin-bottom:8px"><span class="mut">Agir como:</span><select id="actAs"></select></div>
      <div id="chat"></div>
      <div class="row" style="margin-top:10px;flex-wrap:nowrap">
        <input type="text" id="text" placeholder="Escrever no chat…" maxlength="500">
        <button id="send">Enviar</button>
      </div>
      <div class="row" style="margin-top:6px"><label class="mut"><input type="checkbox" id="multi"> enviar com todas as contas online</label></div>
      <div id="msgErr" class="err"></div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let accounts = [];
const api = async (method, url, body) => {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const toast = (m) => { $('#msgErr').textContent = m; setTimeout(() => ($('#msgErr').textContent = ''), 5000); };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function renderAccounts() {
  $('#count').textContent = accounts.length;
  $('#accounts').innerHTML = accounts.map((a) => `
    <div class="acc">
      <span class="dot ${a.status}"></span>
      <span class="name">${esc(a.login)}${a.error ? `<br><small class="err">${esc(a.error)}</small>` : ''}</span>
      <button class="sec" data-act="${a.status === 'offline' || a.status === 'error' ? 'connect' : 'disconnect'}" data-id="${a.id}">${a.status === 'offline' || a.status === 'error' ? 'Ligar' : 'Parar'}</button>
      <button class="sec" data-act="remove" data-id="${a.id}" title="Remover">✕</button>
    </div>`).join('') || '<span class="mut">Nenhuma conta ainda.</span>';
  const cur = $('#actAs').value;
  $('#actAs').innerHTML = accounts.filter((a) => a.status === 'online').map((a) => `<option value="${a.id}">${esc(a.login)}</option>`).join('');
  if (cur) $('#actAs').value = cur;
}

$('#accounts').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.act === 'remove') { if (confirm('Remover esta conta?')) await api('DELETE', `/api/accounts/${b.dataset.id}`); }
    else await api('POST', `/api/accounts/${b.dataset.id}/${b.dataset.act}`);
  } catch (err) { toast(err.message); }
};
$('#add').onclick = async () => { const { url } = await api('POST', '/api/accounts/invite'); window.open(url, '_blank'); };
$('#invite').onclick = async () => {
  const { url } = await api('POST', '/api/accounts/invite');
  try { await navigator.clipboard.writeText(url); } catch {}
  prompt('Envia este link ao moderador (válido 15 min, uso único):', url);
};
$('#all').onclick = () => api('POST', '/api/connect-all').catch((e) => toast(e.message));

const mod = (action, extra = {}) => {
  const accountId = $('#actAs').value;
  if (!accountId) return toast('Nenhuma conta online para agir');
  return api('POST', '/api/mod', { accountId, action, ...extra }).catch((e) => toast(e.message));
};
document.querySelectorAll('[data-set]').forEach((b) => (b.onclick = () => mod('settings', { settings: JSON.parse(b.dataset.set) })));
$('#clear').onclick = () => confirm('Limpar o chat?') && mod('clear');

async function send() {
  const message = $('#text').value; if (!message.trim()) return;
  const online = accounts.filter((a) => a.status === 'online').map((a) => a.id);
  const ids = $('#multi').checked ? online : [$('#actAs').value].filter(Boolean);
  if (!ids.length) return toast('Nenhuma conta online');
  try { await api('POST', '/api/say', { accountIds: ids, message }); $('#text').value = ''; } catch (e) { toast(e.message); }
}
$('#send').onclick = send;
$('#text').onkeydown = (e) => e.key === 'Enter' && send();

const chat = $('#chat');
function addMsg(m) {
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = `<span class="tools">
      <button class="sec" data-a="timeout" title="Timeout 10 min">⏱</button>
      <button class="sec" data-a="delete" title="Apagar mensagem">🗑</button>
      <button class="danger" data-a="ban" title="Banir">⛔</button></span>
    <span class="u" style="color:${m.color || 'var(--acc)'}">${esc(m.user)}</span>${esc(m.text)}`;
  d.querySelector('.tools').onclick = (e) => {
    const a = e.target.closest('button')?.dataset.a; if (!a) return;
    if (a === 'ban' && !confirm(`Banir ${m.user}?`)) return;
    mod(a, { userId: m.userId, messageId: m.id, duration: 600 });
  };
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
  chat.appendChild(d);
  while (chat.children.length > 300) chat.firstChild.remove();
  if (atBottom) chat.scrollTop = chat.scrollHeight;
}

const es = new EventSource('/api/events');
es.addEventListener('chat', (e) => addMsg(JSON.parse(e.data)));
es.addEventListener('accounts', (e) => { accounts = JSON.parse(e.data); renderAccounts(); });
api('GET', '/api/accounts').then((r) => ($('#channel').textContent = '#' + r.channel));
</script>
</body>
</html>
